<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birikim Okulları – 2026-2027 Veli Kılavuzları Sunum Portalı</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --kademe-color: #16a34a;
      --kademe-bg: #dcfce7;
      --kademe-border: #bbf7d0;
      --dark: #0f172a;
      --surface: #ffffff;
      --border: #e2e8f0;
      --bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      padding: 16px;
      color: var(--dark);
    }

    /* Yatay Geniş Sunum Taşıyıcısı */
    .deck-container {
      max-width: 1240px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Üst Konsol Başlığı */
    .deck-header {
      background: #0f172a;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 3px solid var(--kademe-color);
      transition: border-color 0.3s ease;
    }

    .brand-title {
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-tag {
      background: #e11d48;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .period-indicator {
      color: #94a3b8;
      font-size: 0.82rem;
      font-weight: 600;
    }

    /* Yatay Kademe Seçim Sekmeleri (Navigasyon 1) */
    .kademe-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }

    .kademe-tab {
      padding: 14px 12px;
      border: none;
      background: transparent;
      font-size: 0.92rem;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      transition: all 0.2s ease;
      position: relative;
    }

    .kademe-tab span.small {
      font-size: 0.7rem;
      font-weight: 500;
      opacity: 0.8;
    }

    .kademe-tab:hover {
      background: #f8fafc;
      color: #0f172a;
    }

    .kademe-tab.active {
      color: var(--kademe-color);
      background: var(--kademe-bg);
    }

    .kademe-tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--kademe-color);
    }

    /* Yatay Sınıf Seçim Çubuğu (Navigasyon 2) */
    .class-selector-bar {
      background: #f8fafc;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .class-bar-title {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #64748b;
      white-space: nowrap;
    }

    .class-pills {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
    }

    .pill-btn {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .pill-btn:hover {
      border-color: var(--kademe-color);
      color: var(--kademe-color);
    }

    .pill-btn.active {
      background: var(--kademe-color);
      color: #ffffff;
      border-color: var(--kademe-color);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
    }

    /* Belge Üst Araç Çubuğu (Aksiyonlar) */
    .viewer-toolbar {
      padding: 12px 24px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .current-doc-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .doc-badge {
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 800;
      background: var(--kademe-bg);
      color: var(--kademe-color);
    }

    .doc-name {
      font-size: 1rem;
      font-weight: 800;
      color: #0f172a;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
    }

    .btn-outline {
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: #334155;
    }

    .btn-outline:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn-solid {
      background: var(--kademe-color);
      color: #ffffff;
      border: 1.5px solid var(--kademe-color);
    }

    .btn-solid:hover {
      opacity: 0.9;
    }

    /* Gömülü PDF Alanı */
    .pdf-viewport {
      width: 100%;
      height: 760px;
      background: #334155;
      position: relative;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Mobil Uyumlu Uyarı / Destek Kutusu */
    .mobile-support-bar {
      display: none;
      padding: 12px 16px;
      background: #eff6ff;
      border-top: 1px solid #bfdbfe;
      font-size: 0.8rem;
      color: #1e40af;
      text-align: center;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .kademe-nav {
        grid-template-columns: repeat(2, 1fr);
      }
      .pdf-viewport {
        height: 520px;
      }
      .mobile-support-bar {
        display: block;
      }
    }
  </style>
</head>
<body>

<div class="deck-container">
  <!-- Üst Başlık -->
  <div class="deck-header">
    <div class="brand-title">
      <span>BİRİKİM OKULLARI</span>
      <span class="brand-tag">2026-2027</span>
    </div>
    <div id="periodLabel" class="period-indicator">
      Ortak Dil Oluşturma Dönemi (İlkokul)
    </div>
  </div>

  <!-- Yatay Kademe Sekmeleri (Anaokulu, İlkokul, Ortaokul, Lise) -->
  <nav class="kademe-nav">
    <button class="kademe-tab" onclick="kademeDegistir('anaokulu')" data-kademe="anaokulu">
      <span>🎨 Anaokulu</span>
      <span class="small">Hayata Dokunma</span>
    </button>
    <button class="kademe-tab active" onclick="kademeDegistir('ilkokul')" data-kademe="ilkokul">
      <span>📚 İlkokul</span>
      <span class="small">Ortak Dil Oluşturma</span>
    </button>
    <button class="kademe-tab" onclick="kademeDegistir('ortaokul')" data-kademe="ortaokul">
      <span>💡 Ortaokul</span>
      <span class="small">Düşünme - Duyuş</span>
    </button>
    <button class="kademe-tab" onclick="kademeDegistir('lise')" data-kademe="lise">
      <span>🎓 Lise</span>
      <span class="small">Üniversal Dönem</span>
    </button>
  </nav>

  <!-- Yatay Sınıf Seçim Çubuğu -->
  <div class="class-selector-bar">
    <span class="class-bar-title">Sınıf Seçiniz:</span>
    <div id="pillsContainer" class="class-pills"></div>
  </div>

  <!-- PDF Önizleme Araç Çubuğu -->
  <div class="viewer-toolbar">
    <div class="current-doc-info">
      <span id="activeBadge" class="doc-badge">İLKOKUL</span>
      <span id="activeDocTitle" class="doc-name">1. Sınıf Veli Kılavuzu</span>
    </div>
    <div class="toolbar-actions">
      <a id="btnNewTab" href="#" target="_blank" class="action-btn btn-outline" title="Ayrı sekmede tam sayfa aç">
        ⛶ Tam Ekran
      </a>
      <a id="btnDownload" href="#" download class="action-btn btn-solid" title="Orijinal PDF'i Bilgisayara/Telefona İndir">
        📥 PDF İndir
      </a>
    </div>
  </div>

  <!-- Birebir PDF Görüntüleyici -->
  <div class="pdf-viewport">
    <iframe id="pdfFrame" class="pdf-frame" src="" loading="lazy"></iframe>
  </div>

  <div class="mobile-support-bar">
    💡 Dokümanda rahat gezinmek için yukarıdaki <strong>Tam Ekran</strong> butonunu kullanabilirsiniz.
  </div>
</div>

<script>
  // Tüm Kılavuzların Eksiksiz Listesi (PDF Dosya Yolları ile)
  const rehberVeritabani = {
    anaokulu: {
      renk: "#ea580c",
      bg: "#ffedd5",
      donem: "Hayata Dokunma Dönemi (Anaokulu)",
      badge: "ANAOKULU",
      siniflar: [
        { ad: "3 Yaş", dosya: "pdf/3-yas.pdf", yedek: "3 YAŞ VELİ KLAVUZU.pdf" },
        { ad: "4 Yaş", dosya: "pdf/4-yas.pdf", yedek: "4 YAŞ VELİ KLAVUZU.pdf" },
        { ad: "5 Yaş", dosya: "pdf/5-yas.pdf", yedek: "5 YAŞ VELİ KLAVUZU.pdf" }
      ]
    },
    ilkokul: {
      renk: "#16a34a",
      bg: "#dcfce7",
      donem: "Ortak Dil Oluşturma Dönemi (İlkokul)",
      badge: "İLKOKUL",
      siniflar: [
        { ad: "1. Sınıf", dosya: "pdf/1-sinif.pdf", yedek: "1. SINIF VELİ KLAVUZU.pdf" },
        { ad: "2. Sınıf", dosya: "pdf/2-sinif.pdf", yedek: "2. SINIF VELİ KLAVUZU.pdf" },
        { ad: "3. Sınıf", dosya: "pdf/3-sinif.pdf", yedek: "3. SINIF VELİ KLAVUZU.pdf" },
        { ad: "4. Sınıf", dosya: "pdf/4-sinif.pdf", yedek: "4. SINIF VELİ KLAVUZU.pdf" }
      ]
    },
    ortaokul: {
      renk: "#0d9488",
      bg: "#ccfbf1",
      donem: "Düşünme - Duyuş Becerileri Dönemi (Ortaokul)",
      badge: "ORTAOKUL",
      siniflar: [
        { ad: "5. Sınıf", dosya: "pdf/5-sinif.pdf", yedek: "5. SINIF VELİ KLAVUZU.pdf" },
        { ad: "6. Sınıf", dosya: "pdf/6-sinif.pdf", yedek: "6. SINIF VELİ KLAVUZU.pdf" },
        { ad: "7. Sınıf", dosya: "pdf/7-sinif.pdf", yedek: "7. SINIF VELİ KLAVUZU.pdf" },
        { ad: "8. Sınıf", dosya: "pdf/8-sinif.pdf", yedek: "8. SINIF VELİ KLAVUZU.pdf" }
      ]
    },
    lise: {
      renk: "#b91c1c",
      bg: "#fee2e2",
      donem: "Üniversal Dönem (Lise)",
      badge: "LİSE",
      siniflar: [
        { ad: "9. Sınıf", dosya: "pdf/9-sinif.pdf", yedek: "9. SINIF VELİ KLAVUZU.pdf" },
        { ad: "10. Sınıf", dosya: "pdf/10-sinif.pdf", yedek: "10. SINIF VELİ KLAVUZU.pdf" },
        { ad: "11. Sınıf", dosya: "pdf/11-sinif.pdf", yedek: "11. SINIF VELİ KLAVUZU.pdf" },
        { ad: "12. Sınıf", dosya: "pdf/12-sinif.pdf", yedek: "12. SINIF VELİ KLAVUZU.pdf" }
      ]
    }
  };

  let aktifKademe = "ilkokul";
  let aktifSinifIndex = 0;

  function temaUygula(renk, bg) {
    document.documentElement.style.setProperty('--kademe-color', renk);
    document.documentElement.style.setProperty('--kademe-bg', bg);
  }

  function kademeDegistir(kademeKey) {
    aktifKademe = kademeKey;
    aktifSinifIndex = 0;

    // Tab stillerini güncelle
    document.querySelectorAll('.kademe-tab').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-kademe') === kademeKey);
    });

    const kademeData = rehberVeritabani[kademeKey];
    temaUygula(kademeData.renk, kademeData.bg);
    document.getElementById('periodLabel').textContent = kademeData.donem;
    document.getElementById('activeBadge').textContent = kademeData.badge;

    // Yatay sınıf hap butonlarını oluştur
    const pillsContainer = document.getElementById('pillsContainer');
    pillsContainer.innerHTML = '';

    kademeData.siniflar.forEach((sinif, idx) => {
      const btn = document.createElement('button');
      btn.className = `pill-btn ${idx === 0 ? 'active' : ''}`;
      btn.textContent = sinif.ad;
      btn.onclick = () => sinifSec(idx);
      pillsContainer.appendChild(btn);
    });

    pdfYukle(kademeData.siniflar[0]);
  }

  function sinifSec(idx) {
    aktifSinifIndex = idx;
    const buttons = document.querySelectorAll('.pill-btn');
    buttons.forEach((b, i) => b.classList.toggle('active', i === idx));
    
    const sinif = rehberVeritabani[aktifKademe].siniflar[idx];
    pdfYukle(sinif);
  }

  function pdfYukle(sinif) {
    const titleEl = document.getElementById('activeDocTitle');
    titleEl.textContent = `${sinif.ad} Veli Kılavuzu`;

    // PDF Yolunu belirle (Genişlik ve araç çubuğu parametreleriyle)
    const pdfUrl = `${sinif.dosya}#view=FitH&toolbar=1&navpanes=0`;

    const iframe = document.getElementById('pdfFrame');
    iframe.src = pdfUrl;

    // Butonları güncelle
    const btnNewTab = document.getElementById('btnNewTab');
    const btnDownload = document.getElementById('btnDownload');
    
    btnNewTab.href = sinif.dosya;
    btnDownload.href = sinif.dosya;
  }

  // Sayfa ilk açıldığında İlkokul - 1. Sınıf ile başlat
  window.addEventListener('DOMContentLoaded', () => {
    kademeDegistir('ilkokul');
  });
</script>

</body>
</html>
